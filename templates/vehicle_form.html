<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إضافة سيارة</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/assets-custody.css"></head><body class="system-dark"><main class="custody-page"><nav class="custody-nav"><a class="glass-btn home-button" href="/">الرئيسية</a><a class="glass-btn back-btn" href="/assets-custody">⬅ رجوع إلى العهد والسيارات</a></nav><header><h1>إضافة سيارة</h1><p>بيانات السيارة، ويمكن توثيق تسليمها مباشرة إذا اخترت موظفًا.</p></header><form class="custody-panel custody-form" method="post" enctype="multipart/form-data" action="/vehicles"><label>نوع السيارة<input name="vehicle_type" required></label><label>الماركة<input name="make" required></label><label>الموديل<input name="model" required></label><label>سنة الصنع<input type="number" name="manufacture_year" min="1900" max="2100"></label><label>اللون<input name="color"></label><label>رقم اللوحة<input name="plate_number" required></label><label>رقم الهيكل<input name="vin"></label><label>قراءة العداد الحالية / عند التسليم<input type="number" name="current_odometer" min="0" value="0" required></label><label>الموظف المستلم<select name="employee_id"><option value="">غير مسلمة</option>{% for e in employees %}<option value="{{e.id}}">{{e.name}} — {{e.company}}</option>{% endfor %}</select></label><label>تاريخ التسليم<input type="date" name="delivered_at" value="{{today}}"></label><label>ملحقات العهدة<input name="accessories"></label><label>ملاحظات حالة السيارة عند التسليم<textarea name="delivery_notes"></textarea></label><label>صور السيارة عند التسليم<input type="file" name="delivery_images" accept="image/*" multiple></label><label>ملاحظات السيارة العامة<textarea name="notes"></textarea></label><button class="glass-btn gold-text form-action" type="submit">حفظ السيارة</button></form></main></body></html>
