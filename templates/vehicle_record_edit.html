<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تصحيح سجل السيارة</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/assets-custody.css"></head><body class="system-dark"><main class="custody-page"><h1>{{ 'إضافة صيانة' if record_id == 0 else 'تعديل ' ~ record_label }}</h1><p>يتم حفظ التصحيح في السجل نفسه مع الاحتفاظ بأثر التعديل.</p>{% if error %}<div class="notice error" role="alert">{{error}}</div>{% endif %}<form class="custody-panel custody-form" method="post">{% for name,label,type in fields %}<label>{{label}}{% if type == 'textarea' %}<textarea name="{{name}}">{{values.get(name) or ''}}</textarea>{% else %}<input name="{{name}}" type="{{'text' if error else type}}" value="{{values.get(name) if values.get(name) is not none else ''}}" {% if type == 'number' %}min="0" step="1"{% endif %} {% if type == 'datetime-local' %}step="1"{% endif %}>{% endif %}</label>{% endfor %}<button class="glass-btn form-action" type="submit">حفظ {{'الصيانة' if record_id == 0 else 'التعديل'}}</button><a class="glass-btn" href="/vehicle/{{vehicle_id}}">إلغاء والعودة للسيارة</a></form></main></body></html>
