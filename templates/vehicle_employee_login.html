<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ربط حساب الموظف</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/assets-custody.css"></head><body class="system-dark"><main class="custody-page"><h1>حساب الموظف المستلم: {{employee.name}}</h1><p>يتيح هذا الربط للموظف تصحيح سجلاته للسيارات المسلّمة له. اختر الحساب الصحيح باستخدام اسم المستخدم.</p>{% if error %}<div class="notice error">{{error}}</div>{% endif %}<form method="post" class="custody-panel custody-form"><label>حساب الدخول<select name="user_id"><option value="">بدون ربط</option>{% for u in users %}<option value="{{u.id}}" {% if selected == u.id|string %}selected{% endif %}>{{u.full_name}} — {{u.username}} (#{{u.id}})</option>{% endfor %}</select></label><button class="glass-btn">حفظ الربط</button><a class="glass-btn" href="/vehicle/{{vehicle_id}}">العودة للسيارة</a></form></main></body></html>
